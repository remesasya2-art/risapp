name: Lint Python

# POR QUE EL EMPUJON SOLO MIRA `main`, Y EL RESTO LO MIRA EL PULL REQUEST
#
#   Acá decía `on: [push, pull_request]`, y eso corría TODO DOS VECES. Un
#   empujón a una rama con su pull request abierto disparaba las dos tandas
#   completas —lint, la suite del backend y el frontend, seis trabajos— para
#   un solo cambio. Se vio con un commit que tocaba un único archivo de texto:
#
#       run 35015575149 -> lint · Suite del backend · Frontend   (el empujón)
#       run 35015598326 -> lint · Suite del backend · Frontend   (el PR)
#
#   Y eso importa más de lo que parece: la cuenta del proyecto llega al tope
#   de peticiones por hora de GitHub, y ya frenó dos fusiones con el código
#   listo y los tests en verde. Cada trabajo de CI habla con GitHub.
#
#   LAS DOS TANDAS NO PROBABAN LO MISMO, Y POR ESO SE QUEDA LA DEL PR
#
#       La del empujón prueba la rama sola. La del pull request prueba la
#       rama YA MEZCLADA con `main`, que es lo que de verdad va a quedar
#       cuando se fusione. Si `main` se movió mientras el pull request estaba
#       abierto, la primera dice que todo anda y la segunda es la única que
#       ve el choque.
#
#       Así que la que se saca es la del empujón, no la del pull request.
#
#   `main` SIGUE CUBIERTO, Y ES EL QUE DESPLIEGA
#
#       Por eso el empujón se conserva para `main`: cada fusión acá sale a
#       producción, y dejar esa rama sin suite sería cambiar un gasto por un
#       agujero.
#
#   LO QUE SE PIERDE, DICHO
#
#       Una rama SIN pull request abierto ya no corre nada. En este proyecto
#       toda rama termina en un pull request —y el primer empujón queda
#       cubierto en cuanto se abre—, así que la ventana es de minutos. Si
#       algún día se trabaja en ramas sueltas sin abrir pull request, esto hay
#       que volver a mirarlo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install black flake8

      - name: "[BLOQUEANTE] Detectar SyntaxError e IndentationError"
        run: |
          find backend -name "*.py" | xargs python -m py_compile

      - name: "[INFO] Verificar estilo black (no bloquea)"
        run: black --check backend/
        continue-on-error: true

      - name: "[INFO] Verificar estilo flake8 (no bloquea)"
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E501
        continue-on-error: true

  # Hasta ahora CI compilaba los archivos y nada más: los 1782 tests del
  # backend existían y no los corría nadie. Un test que no corre en CI no
  # frena un error, sólo documenta una intención.
  tests:
    name: Suite del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "[BLOQUEANTE] Correr la suite"
        working-directory: backend
        # Sin variable de servidor: los tests de integración HTTP se saltan
        # solos en vez de salir a la red. Ver tests/conftest.py.
        run: python -m pytest tests/ -q --no-header

  # Hasta ahora CI no miraba el frontend en absoluto: ni que compilara. El bug
  # que motivó esto —un `useEffect` adentro de un manejador de eventos, en el
  # panel de administración— pasó por acá sin que nada se quejara.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dos banderas, y las dos tienen historia.
      #
      # `npm install` y no `npm ci` porque no hay package-lock.json en el
      # repositorio. Eso significa que CI puede instalar versiones distintas de
      # las que se probaron. Es una deuda anotada, no un descuido: generar el
      # candado fija lo que resuelva hoy, y es una decisión del operador.
      #
      # `--legacy-peer-deps` porque hay un conflicto de pares que ya existía y
      # que este trabajo destapó: `expo` arrastra `react-native`, que exige
      # react ^19.2.3, y el proyecto fija react 19.1.0. Localmente no se veía
      # —`node_modules` ya estaba instalado y npm no vuelve a resolver—; en un
      # runner limpio, la instalación falla.
      #
      # LA CAUSA DE VERDAD: `expo` está declarado como dependencia y NO SE
      # IMPORTA en ningún lado. El script `npm run expo` corre `expo-shim.cjs`,
      # que sólo lanza Vite y no requiere el paquete. Sacarlo haría desaparecer
      # el conflicto sin banderas.
      #
      # No se sacó acá porque tocar las dependencias de una aplicación que
      # cobra, en el mismo cambio que arregla otra cosa, es widening: si algo
      # en el despliegue espera que `expo` exista, se rompe el deploy y no se
      # sabría cuál de los dos cambios fue. Queda como decisión aparte.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: "[BLOQUEANTE] Que compile"
        working-directory: frontend
        run: npm run build

      - name: "[BLOQUEANTE] Reglas que ya rompieron la aplicación"
        working-directory: frontend
        run: node scripts/lint-bloqueante.mjs

      - name: "[INFO] Lint completo (no bloquea)"
        working-directory: frontend
        run: npm run lint
        continue-on-error: true
