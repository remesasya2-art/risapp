name: Lint Python

# POR QUE EL EMPUJON SOLO MIRA `main`, Y EL RESTO LO MIRA EL PULL REQUEST
#
#   Acá decía `on: [push, pull_request]`, y eso corría TODO DOS VECES. Un
#   empujón a una rama con su pull request abierto disparaba las dos tandas
#   completas —lint, la suite del backend y el frontend, seis trabajos— para
#   un solo cambio. Se vio con un commit que tocaba un único archivo de texto:
#
#       run 35015575149 -> lint · Suite del backend · Frontend   (el empujón)
#       run 35015598326 -> lint · Suite del backend · Frontend   (el PR)
#
#   Y eso importa más de lo que parece: la cuenta del proyecto llega al tope
#   de peticiones por hora de GitHub, y ya frenó dos fusiones con el código
#   listo y los tests en verde. Cada trabajo de CI habla con GitHub.
#
#   LAS DOS TANDAS NO PROBABAN LO MISMO, Y POR ESO SE QUEDA LA DEL PR
#
#       La del empujón prueba la rama sola. La del pull request prueba la
#       rama YA MEZCLADA con `main`, que es lo que de verdad va a quedar
#       cuando se fusione. Si `main` se movió mientras el pull request estaba
#       abierto, la primera dice que todo anda y la segunda es la única que
#       ve el choque.
#
#       Así que la que se saca es la del empujón, no la del pull request.
#
#   `main` SIGUE CUBIERTO, Y ES EL QUE DESPLIEGA
#
#       Por eso el empujón se conserva para `main`: cada fusión acá sale a
#       producción, y dejar esa rama sin suite sería cambiar un gasto por un
#       agujero.
#
#   LO QUE SE PIERDE, DICHO
#
#       Una rama SIN pull request abierto ya no corre nada. En este proyecto
#       toda rama termina en un pull request —y el primer empujón queda
#       cubierto en cuanto se abre—, así que la ventana es de minutos. Si
#       algún día se trabaja en ramas sueltas sin abrir pull request, esto hay
#       que volver a mirarlo.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install black flake8

      - name: "[BLOQUEANTE] Detectar SyntaxError e IndentationError"
        run: |
          find backend -name "*.py" | xargs python -m py_compile

      - name: "[INFO] Verificar estilo black (no bloquea)"
        run: black --check backend/
        continue-on-error: true

      - name: "[INFO] Verificar estilo flake8 (no bloquea)"
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E501
        continue-on-error: true

  # Hasta ahora CI compilaba los archivos y nada más: los 1782 tests del
  # backend existían y no los corría nadie. Un test que no corre en CI no
  # frena un error, sólo documenta una intención.
  tests:
    name: Suite del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "[BLOQUEANTE] Correr la suite"
        working-directory: backend
        # Sin variable de servidor: los tests de integración HTTP se saltan
        # solos en vez de salir a la red. Ver tests/conftest.py.
        run: python -m pytest tests/ -q --no-header

      # EL ESCANEO DE DEPENDENCIAS VA EN ESTE MISMO TRABAJO, Y AVISA SIN FRENAR
      #
      #   Va acá y no en un trabajo aparte porque cada trabajo de CI habla con
      #   GitHub, y la cuenta del proyecto ya llegó al tope de peticiones por
      #   hora dos veces con el código listo. Un paso más en un trabajo que ya
      #   existe no suma peticiones; un trabajo nuevo, sí.
      #
      #   Y no bloquea, a propósito y por ahora: hay advertencias conocidas y
      #   anotadas en la sección 11 del dossier de seguridad (`cryptography`,
      #   que no se puede saltar tres versiones mayores sin un entorno de
      #   ensayo; `litellm`, que no se importa en el código propio). Ponerlo
      #   en bloqueante hoy sería congelar las fusiones por lo que ya se sabe.
      #   El día que la lista quede limpia, se saca el `continue-on-error` y
      #   una dependencia nueva con agujero frena el pull request.
      #
      #   `--no-deps` porque el archivo ya fija cada versión, incluidas las
      #   transitivas; resolver de nuevo sería auditar otra cosa que la que se
      #   despliega. `tests/test_el_ci_escanea_dependencias.py` vigila que el
      #   paso siga estando.
      - name: "[INFO] Escaneo de dependencias del backend (no bloquea)"
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --no-deps --desc off --progress-spinner off
        continue-on-error: true

  # Hasta ahora CI no miraba el frontend en absoluto: ni que compilara. El bug
  # que motivó esto —un `useEffect` adentro de un manejador de eventos, en el
  # panel de administración— pasó por acá sin que nada se quejara.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # LAS DOS BANDERAS QUE HABIA ACA, Y COMO SE FUERON LAS DOS
      #
      # Decía `npm install --legacy-peer-deps`, y el comentario de entonces
      # explicaba por qué: no había candado de versiones, y la bandera tapaba
      # un conflicto de pares que arrastraba `expo` —que exige react ^19.2.3
      # mientras el proyecto fija 19.1.0—. Ese comentario terminaba diciendo
      # que la causa de verdad era que `expo` no se importa en ningún lado, y
      # que sacarlo haría desaparecer el conflicto sin banderas.
      #
      # Eso es lo que se hizo, y el empujón vino de un despliegue caído:
      #
      #     npm error 404 Not Found - GET .../@types/node/-/node-26.6.0.tgz
      #
      # Sin candado, cada instalación resolvía contra lo último publicado ese
      # minuto. `expo` arrastraba `react-native` → `metro` → `jest-worker` →
      # `jest-util` → `@jest/types`, que pide `"@types/node": "*"` — o sea,
      # «la más nueva que haya». El registro tuvo un mal momento y el
      # despliegue murió por algo que nadie de acá había tocado.
      #
      # Ahora: `npm ci` instala EXACTAMENTE lo que dice el candado y falla si
      # el candado y el `package.json` no coinciden. Sin `expo` no queda
      # ninguna dependencia con la versión suelta, y la bandera no hace falta.
      # Lo vigila `tests/test_las_versiones_estan_fijas.py`.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: "[BLOQUEANTE] Que compile"
        working-directory: frontend
        run: npm run build

      - name: "[BLOQUEANTE] Reglas que ya rompieron la aplicación"
        working-directory: frontend
        run: node scripts/lint-bloqueante.mjs

      - name: "[INFO] Lint completo (no bloquea)"
        working-directory: frontend
        run: npm run lint
        continue-on-error: true

      # El escaneo del frontend, con el mismo criterio que el del backend: en
      # el trabajo que ya existe, y avisando sin frenar. `--omit=dev` porque
      # lo que se sirve al visitante es el build; las herramientas de
      # desarrollo no viajan. Sólo alto y crítico: por debajo de eso el ruido
      # de `npm audit` tapa lo que importa.
      - name: "[INFO] Escaneo de dependencias del frontend (no bloquea)"
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
        continue-on-error: true
