name: Lint Python

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install black flake8

      - name: "[BLOQUEANTE] Detectar SyntaxError e IndentationError"
        run: |
          find backend -name "*.py" | xargs python -m py_compile

      - name: "[INFO] Verificar estilo black (no bloquea)"
        run: black --check backend/
        continue-on-error: true

      - name: "[INFO] Verificar estilo flake8 (no bloquea)"
        run: flake8 backend/ --max-line-length=120 --extend-ignore=E501
        continue-on-error: true

  # Hasta ahora CI compilaba los archivos y nada más: los 1782 tests del
  # backend existían y no los corría nadie. Un test que no corre en CI no
  # frena un error, sólo documenta una intención.
  tests:
    name: Suite del backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: "[BLOQUEANTE] Correr la suite"
        working-directory: backend
        # Sin variable de servidor: los tests de integración HTTP se saltan
        # solos en vez de salir a la red. Ver tests/conftest.py.
        run: python -m pytest tests/ -q --no-header
