[variables]
NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20", "stdenv.cc.cc.lib"]

# LA PIEZA DE C++ DEL SISTEMA, Y POR QUE ESTA PEDIDA DOS VECES.
#
#   `numpy` no es Python puro: adentro trae piezas compiladas que necesitan
#   `libstdc++.so.6`, la biblioteca de C++ del sistema. La imagen no la tenía,
#   y el error que se veía en el servidor era literal:
#
#       libstdc++.so.6: cannot open shared object file: No such file or directory
#
#   Eso tumbaba `import pytesseract` entero —`pytesseract` importa `numpy` al
#   cargarse— y el panel de comprobantes decía que no había lector. O sea que
#   el lector nunca llegó ni a buscar el programa: se caía un paso antes.
#
#   Va en las dos listas porque hacen cosas distintas: `nixPkgs` la INSTALA, y
#   `nixLibs` la pone donde el sistema busca las bibliotecas al arrancar un
#   programa. Sólo con la primera queda instalada y no se encuentra, que es
#   exactamente el mismo síntoma que no tenerla.
nixLibs = ["stdenv.cc.cc.lib"]

# EL LECTOR DE COMPROBANTES VA POR APT, NO POR NIX, Y ES A PROPOSITO.
#
#   La primera versión lo pedía como `nixPkgs = [..., "tesseract"]` y en el
#   servidor NO QUEDO: la pantalla de comprobantes decía «el servidor no tiene
#   el lector» y todas las fotos había que asignarlas a mano.
#
#   Por apt aterriza en /usr/bin, que está en el PATH del proceso que sirve la
#   aplicación sin depender de cómo quedó armado el perfil de nix. Y el idioma
#   se pide APARTE y explícito: los comprobantes están en español, y un lector
#   sin `spa` lee peor las palabras aunque los números salgan igual.
#
#   Si aun así no aparece, la aplicación lo dice con el motivo en la pantalla
#   de comprobantes, y se puede apuntar a mano con la variable TESSERACT_CMD
#   sin tocar este archivo.
aptPkgs = ["tesseract-ocr", "tesseract-ocr-spa"]

# EL FRONTEND SE INSTALA CON `npm ci`, Y CON UN CANDADO DE VERSIONES
#
#   Acá decía `npm install --legacy-peer-deps`, sin candado en el repositorio.
#   Eso significa que CADA DESPLIEGUE volvía a resolver las versiones contra lo
#   último que hubiera publicado npm ese minuto. Y se cayó: el despliegue murió
#   pidiendo un archivo que el registro contestó 404 en ese momento —
#
#       npm error 404 Not Found - GET .../@types/node/-/node-26.6.0.tgz
#
#   — por una dependencia que pedía `"@types/node": "*"`, o sea, literalmente
#   «la que se haya publicado más recientemente». No cambió nada del lado de
#   acá: el despliegue dependía de que npm tuviera un buen minuto.
#
#   `npm ci` instala EXACTAMENTE lo que dice `frontend/package-lock.json`, y
#   falla si el candado y el `package.json` no coinciden. Dos despliegues del
#   mismo commit instalan lo mismo.
#
#   La bandera `--legacy-peer-deps` se fue con `expo`: existía para tapar un
#   conflicto que arrastraba ese paquete. Ver `frontend/package.json`.
[phases.build]
cmds = [
  "cd frontend && npm ci && npm run build",
    "python3 -m venv /app/venv && /app/venv/bin/pip install -r backend/requirements.txt"
    ]

    [start]
    # El mismo comando que railway.toml, con los procesos desde `WEB_WORKERS`.
    # El porqué está explicado allá.
    cmd = "cd backend && /app/venv/bin/python -m uvicorn server:app --host 0.0.0.0 --port $PORT --workers ${WEB_WORKERS:-1}"
