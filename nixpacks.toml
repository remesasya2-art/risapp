[variables]
NODE_VERSION = "20"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_20"]

[phases.build]
cmds = [
  "cd frontend && npm install --legacy-peer-deps && npm run build",
    "python3 -m venv /app/venv && /app/venv/bin/pip install -r backend/requirements.txt"
    ]

    [start]
    cmd = "cd backend && /app/venv/bin/python -m uvicorn server:app --host 0.0.0.0 --port $PORT"
